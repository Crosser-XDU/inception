# Experimental continuation from a trained boundary checkpoint.
# Structural settings come from --source-config and must match checkpoint metadata.
# This is an initial KL-distillation recipe, not a validated speedup result.
recurft_stage1_heads_only: false
recurft_recurrent_trainable_only: true
recurft_multistep_residual_only: false
recurft_multistep_step1_residual_only: false

# Freeze the adapted target; supervise predicted hidden -> boundary against its logits.
recurft_hidden_loss_weight: 0.0
recurft_hidden_relative_mse_loss_weight: 0.0
recurft_hidden_cosine_loss_weight: 0.0
recurft_kl_loss_weight: 0.0
recurft_sft_loss_weight: 0.0
recurft_boundary_token_ce_loss_weight: 0.0
recurft_boundary_logit_kl_loss_weight: 0.0

# Keep recurrent_loss_weight positive: the existing loss function gates rollout on it.
recurft_recurrent_loss_weight: 0.1
recurft_recurrent_warmup_steps: 0
recurft_recurrent_relative_mse_loss_weight: 0.0
recurft_recurrent_cosine_loss_weight: 0.0
recurft_recurrent_delta_mse_loss_weight: 0.0
recurft_recurrent_delta_cosine_loss_weight: 0.0

# Effective rollout KL weight after warmup = 0.1 * 10 = 1.0.
# The unavoidable base rollout hidden loss receives weight 0.1.
recurft_multistep_loss_weight: 0.1
recurft_multistep_boundary_token_ce_loss_weight: 0.0
recurft_multistep_boundary_logit_kl_loss_weight: 10.0
recurft_multistep_logit_temperature: 1.0
recurft_multistep_steps: 2
recurft_multistep_detach_rollout: false
recurft_multistep_step_decay: 1.0
recurft_multistep_warmup_steps: 200
recurft_multistep_stride: 64
recurft_multistep_max_starts: 4
recurft_multistep_start_selection: cyclic
recurft_multistep_context_tokens: 0
recurft_multistep_huber_beta: 0.1
recurft_multistep_mse_loss_clip: 0.0
recurft_multistep_trim_ratio: 0.0
recurft_multistep_relative_mse_loss_weight: 0.0
recurft_multistep_cosine_loss_weight: 0.0
recurft_multistep_delta_mse_loss_weight: 0.0
recurft_multistep_delta_cosine_loss_weight: 0.0
recurft_multistep_contrastive_loss_weight: 0.0
recurft_multistep_token_ce_loss_weight: 0.0
recurft_multistep_logit_kl_loss_weight: 0.0
recurft_multistep_logit_tv_loss_weight: 0.0
recurft_multistep_step1_logit_loss_weight: 0.0
recurft_scheduled_sampling_max_ratio: 0.0
recurft_loss_on_labels_only: true

learning_rate: 3.0e-6
lr_scheduler_type: constant
warmup_ratio: 0.0
warmup_steps: 0
optim: adamw_torch
weight_decay: 0.0
max_grad_norm: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
cutoff_len: 1024
ignore_data_skip: true
logging_steps: 25
save_steps: 250
save_total_limit: 4
save_only_model: true
